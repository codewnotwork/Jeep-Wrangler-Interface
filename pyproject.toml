[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wrangler-obd"
version = "0.1.0"
description = "OBD-II monitoring and diagnostics for the 2010 Jeep Wrangler JK via an ELM327 adapter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wrangler-obd = "wrangler_obd.cli:main"

[project.gui-scripts]
wrangler-app = "wrangler_obd.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wrangler_obd = ["app.html", "pi/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
